services:
  spotify-downloader:
    image: spotify-downloader:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spotify-downloader
    restart: unless-stopped
    ports:
      - "9000:8000"
    environment:
      - TZ=Europe/Paris
      - CONFIG_DIR=/config
      - DOWNLOAD_DIR=/music
      # Mot de passe de l'interface Web (fortement recommandé). Laissez vide pour désactiver.
      - APP_PASSWORD=${APP_PASSWORD:-}
      # Port et adresse affichés dans l'interface (doivent correspondre au mapping "ports" ci-dessous)
      - PUBLIC_PORT=9000
      # - PUBLIC_HOST=192.168.1.10
    volumes:
      # Dossier persistant pour la configuration (settings.json, cookies.txt)
      - ./config:/config
      # Dossier hôte Debian où seront enregistrés les MP3 téléchargés
      - /srv/musique:/music
    sysctls:
      - net.ipv4.tcp_mtu_probing=1
    networks:
      - default

networks:
  default:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: "1350"
