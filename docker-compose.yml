services:
  spotify-downloader:
    image: spotify-downloader:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spotify-downloader
    restart: unless-stopped
    ports:
      - "9000:8000"
    environment:
      - TZ=Europe/Paris
      - CONFIG_DIR=/config
      - DOWNLOAD_DIR=/music
    volumes:
      # Dossier persistant pour la configuration (settings.json, cookies.txt)
      - ./config:/config
      # Dossier hôte Debian où seront enregistrés les MP3 téléchargés
      - /srv/musique:/music
    sysctls:
      - net.ipv4.tcp_mtu_probing=1
    networks:
      - default

networks:
  default:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: "1350"
